<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Verallia Turnos 2026 • Fontela</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0a0a0f;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0}
.header{padding:14px 16px;background:#1e2937;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px;padding:10px 16px;background:#1e2937;overflow-x:auto}
.tab{padding:10px 22px;border-radius:999px;background:#334155;color:#94a3b8;font-weight:600}
.tab.active{background:#3b82f6;color:white;box-shadow:0 0 12px #60a5fa}
.today-card{margin:12px 16px;padding:22px;background:linear-gradient(145deg,#1e2937,#0f172a);border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
.shift-big{font-size:58px;font-weight:900;padding:8px 36px;border-radius:999px;background:#3b82f6;color:white;display:inline-block;box-shadow:0 8px 20px rgba(59,130,246,0.5)}
.calendar{margin:0 16px;background:#1e2937;border-radius:24px;padding:16px}
table{width:100%;border-collapse:separate;border-spacing:6px}
.day{background:#334155;border-radius:16px;padding:8px;text-align:center;font-size:15px;font-weight:600;min-height:72px;position:relative}
.day.m{background:#67e8f9;color:#0f172a}
.day.t{background:#86efac;color:#0f172a}
.day.n{background:#a855f7;color:white}
.day.f{background:#64748b;color:#cbd5e1}
.today-ring{box-shadow:0 0 0 4px #f97316 !important}
</style>
</head>
<body>

<div class="header">
  <div><b>Verallia Turnos 2026</b><br><span style="font-size:13px;opacity:0.7">Fontela, Figueira da Foz</span></div>
</div>

<div class="tabs" id="tabs"></div>

<div class="today-card" id="today-card"></div>

<div class="calendar">
  <div style="text-align:center;font-size:20px;font-weight:700;margin-bottom:12px" id="mes">Maio 2026</div>
  <table id="cal"></table>
</div>

<div style="text-align:center;margin:10px 0;font-size:13px">
  🔵 Manhã 🟢 Tarde 🟣 Noite ⚪ Folga 🔴 Hoje
</div>

<script>
// Tabs bonitas
['A','B','C','D','E'].forEach(t=>{
  const b = document.createElement('button');
  b.className = `tab ${t==='A'?'active':''}`;
  b.textContent = `Equipa ${t}`;
  b.onclick = ()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(t); };
  document.getElementById('tabs').appendChild(b);
});

function render(team='A'){
  document.getElementById('today-card').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div>
        <div style="color:#94a3b8;font-size:13px">HOJE • Equipa <b>${team}</b></div>
        <div style="font-size:17px;font-weight:600">Sábado, 30 Maio</div>
        <div style="margin-top:8px">Amanhã: 31 Maio — 05h</div>
      </div>
      <div style="text-align:right">
        <div class="shift-big">05h</div>
        <div style="margin-top:6px;font-size:14px;color:#67e8f9">Manhã 05-13</div>
      </div>
    </div>
    <div style="margin-top:16px;background:#334155;padding:10px 14px;border-radius:12px;font-size:13px">
      05h — Manhã 05-13
    </div>
  `;

  // Calendário bonito igual à tua imagem
  let html = `<tr><th>Dom</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sab</th></tr><tr>`;
  const exemplo = ['n','n','n','n','f','t','t','t','t','f','f','f','f','f','f','f','f','t','t','t','t','f','f','f','t','t','t','t','f','m','m'];
  exemplo.forEach((tipo,i) => {
    const d = i+1;
    let cls = 'day';
    if(tipo==='m') cls += ' m';
    else if(tipo==='t') cls += ' t';
    else if(tipo==='n') cls += ' n';
    else cls += ' f';
    if(d===30) cls += ' today-ring';
    const label = tipo==='m'?'05h':tipo==='t'?'13h':tipo==='n'?'21h':'—';
    html += `<td><div class="${cls}">${d}<br><small>${label}</small></div></td>`;
    if((i+1)%7===0) html += '</tr><tr>';
  });
  document.getElementById('cal').innerHTML = html;
}
render();
</script>
</body>
</html>
