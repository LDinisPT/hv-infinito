<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Verallia Turnos 2026 • Fontela</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{background:linear-gradient(180deg,#0a0a0f,#1e2937);color:#e2e8f0;font-family:'Inter',sans-serif;margin:0}
  .header{padding:16px;background:rgba(15,23,42,0.95);backdrop-filter:blur(20px);display:flex;justify-content:space-between;align-items:center}
  .title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600}
  .tabs{display:flex;gap:7px;padding:10px 16px;background:rgba(15,23,42,0.9);overflow-x:auto}
  .tab{padding:10px 20px;border-radius:999px;background:rgba(51,65,85,0.7);color:#cbd5e1;font-weight:600;transition:0.3s}
  .tab.active{background:#60a5fa;color:#0f172a;box-shadow:0 0 15px #60a5fa}
  .today-card{margin:14px 16px;padding:22px;background:rgba(30,41,59,0.85);backdrop-filter:blur(20px);border-radius:28px;border:1px solid rgba(148,163,184,0.25);box-shadow:0 20px 40px rgba(0,0,0,0.6)}
  .shift{font-size:64px;font-weight:700;line-height:1;color:#60a5fa}
  .calendar{margin:0 16px;background:rgba(30,41,59,0.85);backdrop-filter:blur(20px);border-radius:24px;padding:16px}
  table{width:100%;border-collapse:separate;border-spacing:7px}
  .day{background:rgba(51,65,85,0.9);border-radius:16px;padding:10px 6px;text-align:center;font-weight:600;min-height:74px;box-shadow:0 4px 10px rgba(0,0,0,0.3);transition:0.2s}
  .day.m{background:#67e8f9;color:#0f172a}
  .day.t{background:#86efac;color:#0f172a}
  .day.n{background:linear-gradient(135deg,#c084fc,#a855f7);color:white}
  .day.x{background:#fcd34d;color:#1e2937;font-weight:700}
  .day.today{border:3px solid #f97316;box-shadow:0 0 0 4px #f97316}
  .legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:16px 0;font-size:13px}
  .leg{display:flex;align-items:center;gap:6px}
  .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
</style>
</head>
<body>

<div class="header">
  <div class="title">Verallia Turnos 2026</div>
  <div style="font-size:13px;opacity:0.7">Fontela • Figueira da Foz</div>
</div>

<div class="tabs" id="tabs"></div>

<div class="today-card" id="today-card"></div>

<div class="calendar">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <button onclick="prev()" style="font-size:26px;background:none;border:none;color:#94a3b8">‹</button>
    <b id="mes" style="font-size:20px">Maio 2026</b>
    <button onclick="next()" style="font-size:26px;background:none;border:none;color:#94a3b8">›</button>
  </div>
  <table id="cal"></table>
</div>

<div class="legend">
  <div class="leg"><div class="dot" style="background:#67e8f9"></div>Manhã</div>
  <div class="leg"><div class="dot" style="background:#86efac"></div>Tarde</div>
  <div class="leg"><div class="dot" style="background:#c084fc"></div>Noite</div>
  <div class="leg"><div class="dot" style="background:#fcd34d"></div>Feriado</div>
  <div class="leg"><div class="dot" style="background:#64748b"></div>Folga</div>
</div>

<script>
['A','B','C','D','E'].forEach(t=>{
  const b=document.createElement('button');
  b.className=`tab ${t==='A'?'active':''}`;
  b.textContent=`Equipa ${t}`;
  b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(t)};
  document.getElementById('tabs').appendChild(b);
});

function render(team='A'){
  document.getElementById('today-card').innerHTML=`
    <div style="display:flex;justify-content:space-between">
      <div>
        <div style="opacity:0.7">HOJE • Equipa <b>${team}</b></div>
        <div style="font-size:18px;font-weight:600">Sábado, 30 Maio</div>
        <div style="margin-top:6px">Amanhã: 31 Maio — 05h</div>
      </div>
      <div style="text-align:right">
        <div class="shift">05h</div>
        <div style="color:#67e8f9;font-weight:500">Manhã • 05-13</div>
      </div>
    </div>`;
  
  let html = `<tr><th>Dom</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sab</th></tr><tr>`;
  const dados = ['x','n','n','n','f','t','t','t','t','f','f','f','f','f','f','f','f','t','t','t','t','f','f','f','t','t','t','t','f','m','m'];
  dados.forEach((tipo,i)=>{
    const d = i+1;
    let cls = tipo==='m'?'m':tipo==='t'?'t':tipo==='n'?'n':tipo==='x'?'x':'f';
    let label = tipo==='m'?'05h':tipo==='t'?'13h':tipo==='n'?'21h':tipo==='x'?'FER':'FOLGA';
    html += `<td><div class="day ${cls} ${d===1?'x':''} ${d===30?'today':''}">${d}<br><small>${label}</small></div></td>`;
    if((i+1)%7===0) html += '</tr><tr>';
  });
  document.getElementById('cal').innerHTML = html;
}
render();
</script>
</body>
</html>
