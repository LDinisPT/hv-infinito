*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#060610;color:#e8e8f0;font-family:'Exo 2',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;overscroll-behavior:none;overflow-x:hidden;}

/* Aurora background */

.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:0 0 80px;}

/* TOP BAR */

<script>
const TEAM_COLORS = {A:'m',B:'t',C:'c',D:'n',E:'x'};

const today = new Date();
const todayY = today.getFullYear();
const todayD = today.getDate(), todayM = today.getMonth();

let curTeam = localStorage.getItem('team') || 'A';
let curYear = todayY;
let curMonth = todayM;

const SHIFT_CLS = {'5':'dc-m','13':'dc-t','21':'dc-n','F':'dc-f','X':'dc-x'};
const SHIFT_NUM_LBL = {'5':'05h','13':'13h','21':'21h','F':'Folga','X':'Ferias'};
const SHIFT_DESC = {'5':'Manha 05-13','13':'Tarde 13-21','21':'Noite 21-05','F':'Dia de folga','X':'Ferias + Feriado'};
const STAT_COLORS = {'5':'#FFE600','13':'#00BFFF','21':'#00FFB4'};

function getTeamCls(team) {
  const map = {A:'m',B:'t',C:'c',D:'n',E:'x'};
  return map[team]||'m';
}


function getQuinzenaDays(team, year) {
  const yearData = (SCHEDULES[year]||{})[team]||[];
  const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];
  const quinzena = new Set();
  
  for(let m=0; m<12; m++) {
    for(let d=1; d<=monthDays[m]; d++) {
      const row = (yearData[m]||[]).find(r=>r[0]===d);
      const shift = row ? row[2] : 'F';
      if(shift === 'F') {
        // Count consecutive F days
        let count = 0;
        let mm = m, dd = d;
        while(mm < 12) {
          const r2 = (yearData[mm]||[]).find(r=>r[0]===dd);
          if(!r2 || r2[2] !== 'F') break;
          count++;
          dd++;
          if(dd > monthDays[mm]) { dd=1; mm++; }
        }
        if(count >= 12) {
          // Mark all these days as quinzena
          let mm2 = m, dd2 = d;
          for(let i=0; i<count; i++) {
            quinzena.add(`${mm2}-${dd2}`);
            dd2++;
            if(dd2 > monthDays[mm2]) { dd2=1; mm2++; }
          }
        }
      }
    }
  }
  return quinzena;
}

const RAINBOW_CLS = ['dc-q1','dc-q2','dc-q3','dc-q4','dc-q5','dc-q6','dc-q7'];

async function fetchWeather() {
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.1500&longitude=-8.8608&current=temperature_2m,weathercode&timezone=Europe/Lisbon';
    const res = await fetch(url);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weathercode;
    
    const icons = {
      0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
      45:'🌫️', 48:'🌫️',
      51:'🌦️', 53:'🌦️', 55:'🌧️',
      61:'🌧️', 63:'🌧️', 65:'🌧️',
      71:'❄️', 73:'❄️', 75:'❄️',
      80:'🌦️', 81:'🌧️', 82:'⛈️',
      95:'⛈️', 96:'⛈️', 99:'⛈️'
    };
    const icon = icons[code] || icons[Math.floor(code/10)*10] || '🌡️';
    
    const el = document.getElementById('weather-widget');

      <div class="weather-row"><span class="w-icon">${icon}</span><span class="w-temp">${temp}°</span></div>

  } catch(e) {
    console.log('Weather unavailable');
  }
}

  // 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri
  const todayDow = today.getDay(); // 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
  
  const schedule = [
    { dow:1, name:'2ª feira', enf:'9:00 – 14:00', med:'Dra. Isabel Pedro', medH:'9:00 – 13:00' },
    { dow:2, name:'3ª feira', enf:'9:00 – 14:00', med:'Dr. Isaac Ramos',   medH:'9:00 – 13:00' },
    { dow:3, name:'4ª feira', enf:'9:00 – 14:00', med:'Dra. Isabel Pedro', medH:'14:00 – 18:00', medRole:'Médico tarde' },
    { dow:4, name:'5ª feira', enf:'9:00 – 14:00', med:null },
    { dow:5, name:'6ª feira', enf:'9:00 – 14:00', med:'Dr. Isaac Ramos',   medH:'9:00 – 13:00' },
  ];
  
  const rows = schedule.map(s => {
    const isToday = s.dow === todayDow;

}
function getGreeting() {
  const h = new Date().getHours();
  if(h >= 6 && h < 12) return 'Bom dia';
  if(h >= 12 && h < 20) return 'Boa tarde';
  return 'Boa noite';
}

function formatTime(d) {
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function renderClock() {
  const now = new Date();
  const el = document.getElementById('clock-time');
  if(el) el.textContent = formatTime(now);
}

function isInsideQuinzena(team, year) {
  const quinzenaDays = getQuinzenaDays(team, year);
  return quinzenaDays.has(`${todayM}-${todayD}`);
}

function getRemainingQuinzenaDays(team, year) {
  const quinzenaDays = getQuinzenaDays(team, year);
  const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];
  let count = 0;
  let m = todayM, d = todayD;
  while(m < 12) {
    if(!quinzenaDays.has(`${m}-${d}`)) break;
    count++;
    d++;
    if(d > monthDays[m]) { d=1; m++; }
  }
  return { days: count, returnM: m, returnD: d };
}

function renderQuinzena() {
  const card = document.getElementById('quinzena-card');
  if(!card) return;
  const yearData = (SCHEDULES[curYear]||{})[curTeam]||[];
  const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];
  
  // Find next big rest (14 consecutive F days)
  const today = new Date(todayY, todayM, todayD);
  let found = null;
  let dayCount = 0;
  
  for(let m=0; m<12; m++) {
    const days = monthDays[m];
    for(let d=1; d<=days; d++) {
      const date = new Date(curYear, m, d);
      const row = (yearData[m]||[]).find(r=>r[0]===d);
      const shift = row ? row[2] : 'F';
      if(date >= today && shift === 'F') {
        // Count consecutive F
        let count = 0;
        let mm = m, dd = d;
        while(mm < 12) {
          const r2 = (yearData[mm]||[]).find(r=>r[0]===dd);
          if(!r2 || r2[2] !== 'F') break;
          count++;
          dd++;
          if(dd > monthDays[mm]) { dd=1; mm++; }
        }
        if(count >= 12) {
          found = {date, count, daysUntil: Math.round((date - today) / 86400000)};
          break;
        }
      }
    }
    if(found) break;
  }
  
  const mns = typeof MONTH_NAMES !== 'undefined' ? MONTH_NAMES : MONTH_NAMES_PT;

  // Check if currently inside quinzena
  if(curYear === todayY && isInsideQuinzena(curTeam, curYear)) {
    const rem = getRemainingQuinzenaDays(curTeam, curYear);
    const returnDate = new Date(curYear, rem.returnM, rem.returnD);
    card.innerHTML = `<div class="rainbow-card" style="width:100%;">
      <div class="rainbow-text">
        <span class="c1">E</span><span class="c2">S</span><span class="c3">T</span><span class="c4">A</span><span class="c5">S</span>&nbsp;<span class="c6">D</span><span class="c1">E</span>&nbsp;<span class="c2">F</span><span class="c3">E</span><span class="c4">R</span><span class="c5">I</span><span class="c6">A</span><span class="c1">S</span>&nbsp;<span class="c2">🏖️</span>
      </div>
      <div class="rainbow-sub">Ainda tens ${rem.days} dias · Volta a ${returnDate.getDate()} ${mns[returnDate.getMonth()]}</div>
    </div>`;
    return;
  }

  if(found) {
    const daysLeft = found.daysUntil;
    card.innerHTML = `
      <div class="q-left">
        <div class="q-lbl">Proxima quinzena</div>
        <div class="q-val">${found.date.getDate()} ${mns[found.date.getMonth()]} · ${found.count} dias</div>
      </div>
      <div class="q-days">
        <div class="q-num">${daysLeft}</div>
        <div class="q-sub">${daysLeft===1?'AMANHA':'DIAS'}</div>
      </div>`;
  } else {
    card.innerHTML = '';
  }
}

function renderTodayCard() {
  const t = new Date(todayY, todayM, todayD);
  const tom = new Date(todayY, todayM, todayD+1);
  const s = getShift(curTeam, todayY, todayM, todayD);
  const st = getShift(curTeam, tom.getFullYear(), tom.getMonth(), tom.getDate());
  const fer = getFeriadoLocal(todayD, todayM);
  const ferTom = getFeriado(tom.getFullYear(), tom.getMonth(), tom.getDate());
  const wdays = ['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];
  const mns = (typeof MONTH_NAMES !== 'undefined' ? MONTH_NAMES : MONTH_NAMES_PT);

    const now = new Date();
  const greeting = getGreeting();
  const clockStr = formatTime(now);
  document.getElementById('today-card').innerHTML = `
    <div class="today-top-row">
      <div class="today-left">
        <div class="today-greeting">${greeting} · Equipa ${curTeam}</div>
        <div class="today-clock" id="clock-time">${clockStr}</div>
      </div>
      <div class="today-right" id="weather-widget">
        <div class="weather-row"><span class="w-icon">⛅</span><span class="w-temp">--°</span></div>
        <div class="w-city">Figueira da Foz</div>
      </div>
    </div>
    <div class="today-main">
      <div>
        <div class="today-date">${wdays[t.getDay()]}, ${todayD} ${mns[todayM]}</div>
        ${fer?`<div class="today-fer" style="color:#EF9F27;font-size:11px;">${fer}</div>`:''}
      </div>
      <div class="shift-big shift-big-${s}">
        <div class="shift-num shift-num-${s}">${s==='F'?'—':SHIFT_NUM_LBL[s]}</div>
        <div class="shift-desc shift-desc-${s}">${SHIFT_DESC[s]}</div>
      </div>
    </div>
    <div class="tomorrow-row">
      <div class="tomorrow-lbl">Amanha: ${tom.getDate()} ${mns[tom.getMonth()]}${ferTom?' · '+ferTom:''}</div>
      <div class="tomorrow-badge tb-${st}">${st==='F'?'Folga':SHIFT_NUM_LBL[st]} — ${SHIFT_DESC[st]}</div>
    </div>`;
}

function renderStats() {
  const grid = document.getElementById('stats-grid');
  if(!grid) return;
  let m=0,t=0,n=0,f=0,x=0;
  const yearData = (SCHEDULES[curYear]||{})[curTeam]||[];
  yearData.forEach(month => month.forEach(row => {
    const s = row[2];
    if(s==='5') m++;
    else if(s==='13') t++;
    else if(s==='21') n++;
    else if(s==='X') x++;
    else f++;
  }));
  const stats = [
    {num:m,lbl:'Manha',color:'#378ADD'},
    {num:t,lbl:'Tarde',color:'#1D9E75'},
    {num:n,lbl:'Noite',color:'#7F77DD'},
    {num:m+t+n+x,lbl:'Trabalhados',color:'rgba(255,255,255,0.2)'},
  ];
  grid.innerHTML = stats.map(s=>`
    <div class="stat">
      <div class="stat-bar" style="background:${s.color}"></div>
      <div><div class="stat-num" style="color:${s.color}">${s.num}</div><div class="stat-lbl">${s.lbl}</div></div>
    </div>`).join('');
}

function renderFeriados() {
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const items = [];
  const shiftColors = {'5':'#85B7EB','13':'#5DCAA5','21':'#AFA9EC','F':'rgba(255,255,255,0.2)','X':'#FFD166'};
  for(let d=1;d<=daysInMonth;d++){
    const fer = getFeriadoLocal(d, curMonth);
    if(fer){
      const s = getShift(curTeam, curYear, curMonth, d);
      const isX = s==='X';
      items.push(`<div class="fer-item">
        <span class="fer-day">${d}</span>
        <span class="fer-name">${fer}</span>
        <span class="fer-shift" style="color:${shiftColors[s]||''}">${isX?'Ferias':s==='F'?'Folga':SHIFT_NUM_LBL[s]}</span>
      </div>`);
    }
  }
  const itemsEl = document.getElementById('fer-items');
  if(itemsEl) itemsEl.innerHTML = items.length > 0 ? items.join('') : '<div style="color:rgba(255,255,255,0.2);font-size:12px;">Sem feriados este mes</div>';
}

function renderCalendar() {
  const mns = (typeof MONTH_NAMES !== 'undefined' ? MONTH_NAMES : MONTH_NAMES_PT);
  document.getElementById('month-title').textContent = mns[curMonth] + ' ' + curYear;
  const yearData = (SCHEDULES[curYear]||{})[curTeam]||[];
  const data = yearData[curMonth]||[];
  const firstDow = new Date(curYear, curMonth, 1).getDay();
  const quinzenaDays = getQuinzenaDays(curTeam, curYear);
  const tbody = document.getElementById('cal-body');
  tbody.innerHTML = '';
  let cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7) cells.push(null);
  for(let r=0;r<cells.length/7;r++){
    const tr = document.createElement('tr');
    for(let c=0;c<7;c++){
      const td = document.createElement('td');
      const day = cells[r*7+c];
      if(day){
        const row = data.find(x=>x[0]===day);
        const shift = row ? row[2] : 'F';
        const isToday = curYear===todayY && curMonth===todayM && day===todayD;
        const hasFer = !!getFeriadoLocal(day, curMonth);
        const isX = shift==='X';
        const isQuinzena = shift==='F' && quinzenaDays.has(`${curMonth}-${day}`);
        const cls = SHIFT_CLS[shift]||'dc-f';
        const div = document.createElement('div');
        div.className = `day-cell ${cls}${isToday?' today-ring':''}`;
        const faixaHTML = isX
          ? '<div class="faixa faixa-x"><span>FERIAS</span></div>'
          : hasFer ? '<div class="faixa faixa-fer"><span>FERIADO</span></div>' : '';
        div.innerHTML = `${faixaHTML}<span class="day-num">${day}</span><span class="day-lbl">${shift==='F'?'Folga':SHIFT_NUM_LBL[shift]}</span>`;
        td.appendChild(div);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

function setTeam(t){
  curTeam = t;
  localStorage.setItem('team',t);
  document.querySelectorAll('.team-tab').forEach(b=>{
    b.className = 'team-tab' + (b.dataset.team===t?' active-'+t:'');
  });
  renderTodayCard();
  renderCalendar();
  renderFeriados();
  renderMedico();
  renderStats();
  renderQuinzena();
}

document.getElementById('tabs').addEventListener('click', e=>{
  if(e.target.dataset.team) setTeam(e.target.dataset.team);
});

document.getElementById('prev-yr').onclick = ()=>{curYear--;document.getElementById('year-lbl').textContent=curYear;renderTodayCard();renderCalendar();renderFeriados();renderStats();};
document.getElementById('next-yr').onclick = ()=>{curYear++;document.getElementById('year-lbl').textContent=curYear;renderTodayCard();renderCalendar();renderFeriados();renderStats();};
document.getElementById('prev-mo').onclick = ()=>{if(curMonth===0){curMonth=11;curYear--;}else curMonth--;document.getElementById('year-lbl').textContent=curYear;renderCalendar();renderFeriados();};
document.getElementById('next-mo').onclick = ()=>{if(curMonth===11){curMonth=0;curYear++;}else curMonth++;document.getElementById('year-lbl').textContent=curYear;renderCalendar();renderFeriados();};

const MONTH_NAMES_PT = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const FERIADOS_2026_LOCAL = {"1-1":"Ano Novo","18-1":"Dia do Vidreiro","17-2":"Carnaval","3-4":"Sexta-feira Santa","5-4":"Pascoa","25-4":"Dia da Liberdade","1-5":"Dia do Trabalhador","4-6":"Corpo de Deus","10-6":"Dia de Portugal","24-6":"Sao Joao","15-8":"Assuncao N.Sra.","5-10":"Implantacao Republica","1-11":"Todos os Santos","1-12":"Restauracao Independencia","8-12":"Imaculada Conceicao","25-12":"Natal"};
const FERIADOS_2027_LOCAL = {"1-1":"Ano Novo","18-1":"Dia do Vidreiro","9-2":"Carnaval","26-3":"Sexta-feira Santa","28-3":"Pascoa","25-4":"Dia da Liberdade","1-5":"Dia do Trabalhador","27-5":"Corpo de Deus","10-6":"Dia de Portugal","24-6":"Sao Joao","15-8":"Assuncao N.Sra.","5-10":"Implantacao Republica","1-11":"Todos os Santos","1-12":"Restauracao Independencia","8-12":"Imaculada Conceicao","25-12":"Natal"};

function getFeriadoLocal(day, month) {
  const key = `${day}-${month+1}`;
  if(curYear===2026) return FERIADOS_2026_LOCAL[key]||'';
  if(curYear===2027) return FERIADOS_2027_LOCAL[key]||'';
  return '';
}

document.getElementById('year-lbl').textContent = curYear;

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('install-bar').classList.add('show');
});
document.getElementById('install-btn').onclick = async()=>{
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('install-bar').classList.remove('show'); }
};

setTeam(curTeam);
setInterval(renderClock, 1000);
renderQuinzena();
renderMedico();
fetchWeather();
setInterval(fetchWeather, 1800000);
</script>

<script>
if('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  }).then(() => {
    navigator.serviceWorker.register('sw.js?v=9').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', () => {
          if(newSW.state === 'activated') window.location.reload();
        });
      });
    });
  });
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data === 'reload') window.location.reload();
  });
}
</script>
