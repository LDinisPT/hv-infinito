<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#060610;color:#e8e8f0;font-family:'Exo 2',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;overscroll-behavior:none;overflow-x:hidden;}

/* Aurora background */
body::before{content:'';position:fixed;top:-100px;left:-80px;width:300px;height:250px;background:radial-gradient(ellipse,rgba(55,138,221,0.08),transparent 70%);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;top:-60px;right:-60px;width:220px;height:200px;background:radial-gradient(ellipse,rgba(0,107,63,0.07),transparent 70%);pointer-events:none;z-index:0;}

.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:0 0 80px;}

/* TOP BAR */
.topbar{padding:10px 14px;position:sticky;top:0;z-index:100;background:rgba(6,6,16,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.07);}
.topbar-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.logo-wrap{display:flex;flex-direction:row;align-items:center;gap:10px;flex:1;}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:3px;}
.logo-img{height:44px;object-fit:contain;}
.logo-fallback{background:#006B3F;padding:4px 10px;border-radius:6px;font-family:'Montserrat',sans-serif;font-size:13px;font-weight:900;color:#fff;letter-spacing:.08em;}
.logo-name{font-size:16px;font-weight:700;color:#4aab6a;letter-spacing:.01em;white-space:nowrap;}
.logo-sub{font-size:11px;color:rgba(74,171,106,0.6);margin-bottom:1px;}
.logo-credit{font-size:11px;color:rgba(255,255,255,0.55);}
.year-nav{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:4px 10px;flex-shrink:0;}
.year-lbl{font-size:16px;font-weight:600;color:rgba(255,255,255,0.7);min-width:38px;text-align:center;}
.nav-btn{background:transparent;border:none;color:rgba(255,255,255,0.4);font-size:20px;padding:2px 4px;cursor:pointer;line-height:1;}
.nav-btn:active{color:#fff;}

.team-tabs{display:flex;gap:4px;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none;}
.team-tab{flex:1;min-width:0;padding:6px 4px;border-radius:20px;border:0.5px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.3);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;text-align:center;white-space:nowrap;}
.team-tab.active-A{border-color:rgba(255,230,0,0.4);background:rgba(255,230,0,0.08);color:#FFE600;}
.team-tab.active-B{border-color:rgba(29,158,117,0.5);background:rgba(29,158,117,0.12);color:#5DCAA5;}
.team-tab.active-C{border-color:rgba(208,89,74,0.5);background:rgba(208,89,74,0.12);color:#F09595;}
.team-tab.active-D{border-color:rgba(127,119,221,0.5);background:rgba(127,119,221,0.12);color:#AFA9EC;}
.team-tab.active-E{border-color:rgba(186,117,23,0.5);background:rgba(186,117,23,0.12);color:#EF9F27;}

/* TODAY CARD */
.today-card{margin:12px 12px 0;padding:16px;border-radius:18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);}
.today-lbl{font-size:12px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;}
.today-main{display:flex;align-items:center;justify-content:space-between;}
.today-date{font-size:14px;color:rgba(255,255,255,0.7);}
.today-fer{font-size:11px;margin-top:3px;}
.shift-big{padding:10px 20px;border-radius:12px;text-align:center;}
.shift-big-5{background:rgba(255,230,0,0.1);border:0.5px solid rgba(255,230,0,0.25);}
.shift-big-13{background:rgba(0,191,255,0.1);border:0.5px solid rgba(0,191,255,0.25);}
.shift-big-21{background:rgba(0,255,180,0.1);border:0.5px solid rgba(0,255,180,0.25);}
.shift-big-F{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.08);}
.shift-big-X{background:rgba(217,160,48,0.12);border:0.5px solid rgba(217,160,48,0.25);}
.shift-num{font-size:26px;font-weight:200;letter-spacing:-.02em;}
.shift-num-5{color:#FFE600;} .shift-num-13{color:#00BFFF;} .shift-num-21{color:#00FFB4;} .shift-num-F{color:rgba(255,255,255,0.35);} .shift-num-X{color:#FFD166;}
.shift-desc{font-size:12px;margin-top:2px;letter-spacing:.03em;}
.shift-desc-5{color:rgba(255,230,0,0.5);} .shift-desc-13{color:rgba(0,191,255,0.5);} .shift-desc-21{color:rgba(0,255,180,0.5);} .shift-desc-F{color:rgba(255,255,255,0.3);} .shift-desc-X{color:rgba(255,209,102,0.5);}
.tomorrow-row{margin-top:10px;padding-top:10px;border-top:0.5px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between;}
.tomorrow-lbl{font-size:11px;color:rgba(255,255,255,0.25);}
.tomorrow-badge{font-size:12px;padding:4px 12px;border-radius:10px;}
.tb-5{background:rgba(255,230,0,0.08);color:#FFE600;}
.tb-13{background:rgba(0,191,255,0.08);color:#00BFFF;}
.tb-21{background:rgba(0,255,180,0.08);color:#00FFB4;}
.tb-F{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.35);}
.tb-X{background:rgba(217,160,48,0.1);color:#FFD166;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 12px 0;}
.stat{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
.stat-bar{width:3px;height:32px;border-radius:2px;flex-shrink:0;}
.stat-num{font-size:24px;font-weight:300;color:#fff;line-height:1;}
.stat-lbl{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px;letter-spacing:.03em;}

/* FERIADOS */
.fer-list{margin:10px 12px 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);display:block;}
.fer-list-title{font-size:12px;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;}
.fer-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid rgba(255,255,255,0.05);font-size:13px;}
.fer-item:last-child{border-bottom:none;}
.fer-day{font-weight:600;color:#EF9F27;min-width:26px;font-size:14px;}
.fer-name{color:rgba(255,255,255,0.75);flex:1;}
.fer-shift{font-size:13px;}

/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 0;}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;}
.leg-dot{width:8px;height:8px;border-radius:50%;}

/* CALENDAR */
.cal-header{display:flex;align-items:center;justify-content:center;padding:14px 12px 8px;gap:16px;}
.month-title{font-size:18px;font-weight:600;color:rgba(255,255,255,0.9);min-width:160px;text-align:center;letter-spacing:-.01em;}
.cal-nav-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:rgba(255,255,255,0.6);font-size:20px;padding:7px 18px;cursor:pointer;line-height:1;}
.cal-wrap{padding:0 8px 0;}
.cal{width:100%;border-collapse:separate;border-spacing:3px;}
.cal th{font-size:11px;color:rgba(255,255,255,0.35);padding:3px 0;text-align:center;font-weight:400;letter-spacing:.06em;text-transform:uppercase;}
.cal td{padding:0;}
.day-cell{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:54px;border-radius:12px;position:relative;overflow:hidden;padding-bottom:6px;}
.day-num{font-size:15px;font-weight:400;}
.day-lbl{font-size:11px;font-weight:500;margin-top:1px;letter-spacing:.02em;}
.dc-m{background:rgba(255,230,0,0.12);border:0.5px solid rgba(255,230,0,0.3);}
.dc-m .day-num{color:#FFE600;} .dc-m .day-lbl{color:rgba(255,230,0,0.6);}
.dc-t{background:rgba(0,191,255,0.12);border:0.5px solid rgba(0,191,255,0.3);}
.dc-t .day-num{color:#00BFFF;} .dc-t .day-lbl{color:rgba(0,191,255,0.6);}
.dc-n{background:rgba(0,255,180,0.12);border:0.5px solid rgba(0,255,180,0.3);}
.dc-n .day-num{color:#00FFB4;} .dc-n .day-lbl{color:rgba(0,255,180,0.6);}
.dc-f{background:rgba(100,180,40,0.12);border:0.5px solid rgba(100,180,40,0.25);}
.dc-f .day-num{color:#A8D870;} .dc-f .day-lbl{color:rgba(168,216,112,0.6);}
.dc-x{background:rgba(217,160,48,0.15);border:0.5px solid rgba(217,160,48,0.3);}
.dc-x .day-num{color:#FFD166;} .dc-x .day-lbl{color:rgba(255,209,102,0.65);}
.dc-c{background:rgba(208,89,74,0.12);border:0.5px solid rgba(208,89,74,0.2);}
.dc-c .day-num{color:#F09595;} .dc-c .day-lbl{color:rgba(240,149,149,0.55);}
.today-ring{outline:1.5px solid rgba(226,75,74,0.7);outline-offset:1px;}
.faixa{position:absolute;top:0;left:0;right:0;height:12px;display:flex;align-items:center;justify-content:center;}
.faixa-fer{background:rgba(186,117,23,0.35);}
.faixa-fer span{font-size:6px;font-weight:700;color:#EF9F27;letter-spacing:.08em;text-transform:uppercase;}
.faixa-x{background:rgba(217,160,48,0.3);}
.faixa-x span{font-size:6px;font-weight:700;color:#FFD166;letter-spacing:.06em;}

/* INSTALL */
.install-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(6,6,16,0.95);backdrop-filter:blur(12px);border-top:0.5px solid rgba(255,255,255,0.08);padding:12px 16px;display:none;align-items:center;gap:10px;z-index:200;}
.install-bar.show{display:flex;}
.install-txt{flex:1;font-size:13px;color:rgba(255,255,255,0.5);}
.install-btn{padding:8px 18px;border-radius:20px;background:rgba(55,138,221,0.15);border:0.5px solid rgba(55,138,221,0.3);color:#85B7EB;font-size:13px;font-weight:500;cursor:pointer;}
.team-tabs::-webkit-scrollbar{display:none;}

.quinzena-card{margin:8px 12px 0;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between;}
.q-left .q-lbl{font-size:12px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:.1em;}
.q-left .q-val{font-size:14px;color:rgba(255,255,255,0.6);margin-top:3px;}
.q-days{text-align:center;}
.q-days .q-num{font-size:28px;font-weight:200;color:#A8D870;line-height:1;}
.q-days .q-sub{font-size:11px;color:rgba(168,216,112,0.5);margin-top:2px;letter-spacing:.04em;}

.dc-q1{background:rgba(255,107,107,0.15);border:0.5px solid rgba(255,107,107,0.3);}
.dc-q1 .day-num{color:#FF8E8E;}.dc-q1 .day-lbl{color:rgba(255,142,142,0.7);}
.dc-q2{background:rgba(255,159,67,0.15);border:0.5px solid rgba(255,159,67,0.3);}
.dc-q2 .day-num{color:#FFB570;}.dc-q2 .day-lbl{color:rgba(255,181,112,0.7);}
.dc-q3{background:rgba(254,202,87,0.15);border:0.5px solid rgba(254,202,87,0.3);}
.dc-q3 .day-num{color:#FFD966;}.dc-q3 .day-lbl{color:rgba(255,217,102,0.7);}
.dc-q4{background:rgba(72,219,113,0.15);border:0.5px solid rgba(72,219,113,0.3);}
.dc-q4 .day-num{color:#70DDA8;}.dc-q4 .day-lbl{color:rgba(112,221,168,0.7);}
.dc-q5{background:rgba(84,160,255,0.15);border:0.5px solid rgba(84,160,255,0.3);}
.dc-q5 .day-num{color:#85B7EB;}.dc-q5 .day-lbl{color:rgba(133,183,235,0.7);}
.dc-q6{background:rgba(155,89,182,0.15);border:0.5px solid rgba(155,89,182,0.3);}
.dc-q6 .day-num{color:#C890F0;}.dc-q6 .day-lbl{color:rgba(200,144,240,0.7);}
.dc-q7{background:rgba(255,107,107,0.15);border:0.5px solid rgba(255,107,107,0.3);}
.dc-q7 .day-num{color:#FF8E8E;}.dc-q7 .day-lbl{color:rgba(255,142,142,0.7);}

.rainbow-card{background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,200,100,0.15);border-radius:16px;padding:16px;text-align:center;}
.rainbow-text{font-size:22px;font-weight:800;letter-spacing:.04em;line-height:1.2;}
.rainbow-text .c1{color:#FF6B6B;}.rainbow-text .c2{color:#FF9F43;}
.rainbow-text .c3{color:#FECA57;}.rainbow-text .c4{color:#48DB71;}
.rainbow-text .c5{color:#54A0FF;}.rainbow-text .c6{color:#9B59B6;}
.rainbow-sub{font-size:12px;color:rgba(255,255,255,0.35);margin-top:8px;}

.today-top-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
.today-left .today-greeting{font-size:12px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:.1em;}
.today-left .today-clock{font-size:22px;font-weight:200;color:rgba(255,255,255,0.7);margin-top:3px;}
.today-right{text-align:right;}
.weather-row{display:flex;align-items:center;gap:6px;justify-content:flex-end;}
.w-icon{font-size:22px;line-height:1;}
.w-temp{font-size:20px;font-weight:200;color:rgba(255,255,255,0.7);}
.w-city{font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px;}

.medico-card{margin:8px 12px 0;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px 16px;}
.medico-title{font-size:12px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.medico-title span{font-size:14px;}
.medico-row{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;margin-bottom:4px;padding:8px;border-radius:10px;}
.medico-day{font-size:13px;font-weight:500;color:rgba(255,255,255,0.4);padding-top:2px;}
.medico-person{display:flex;flex-direction:column;gap:2px;}
.medico-name{font-size:13px;color:rgba(255,255,255,0.6);}
.medico-hours{font-size:12px;color:rgba(0,191,255,0.6);}
.medico-role{font-size:11px;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:.05em;}
.medico-none{font-size:13px;color:rgba(255,255,255,0.3);padding-top:14px;}
.medico-today{background:rgba(255,230,0,0.06);border:1px solid rgba(255,230,0,0.3);}
.medico-today .medico-day{color:#FFE600;font-weight:600;}
.medico-today .medico-name{color:rgba(255,255,255,0.9);}
.medico-today .medico-hours{color:rgba(0,191,255,0.9);}
.medico-today .medico-role{color:rgba(255,255,255,0.4);}

.ciclo-card{margin:8px 12px 0;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px 16px;}
.ciclo-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.ciclo-title{font-size:14px;font-weight:600;}
.ciclo-sub{font-size:12px;color:rgba(255,255,255,0.3);margin-top:2px;}
.ciclo-right{text-align:right;}
.ciclo-num{font-size:28px;font-weight:300;line-height:1;}
.ciclo-sub2{font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:.06em;margin-top:1px;}
.ciclo-dots{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.ciclo-dot{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:1.5px solid;position:relative;}
.ciclo-dot-done{background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.08);}
.ciclo-dot-done::after{content:'✕';font-size:14px;color:rgba(255,255,255,0.35);}
.ciclo-dot-today{border-width:2px;}
.ciclo-dot-future{background:rgba(255,255,255,0.02);border-color:rgba(255,255,255,0.06);}
.ciclo-dot-future span{color:rgba(255,255,255,0.35);font-size:12px;}
.ciclo-next{padding-top:10px;border-top:0.5px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between;}
.ciclo-next-lbl{font-size:12px;color:rgba(255,255,255,0.25);}
.ciclo-next-val{font-size:13px;font-weight:500;}

.weather-row{display:flex;align-items:center;gap:6px;justify-content:flex-end;}
.w-icon{font-size:24px;}
.w-temp{font-size:22px;font-weight:300;color:rgba(255,255,255,0.75);}
.w-desc{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;text-align:right;}
.w-pills{display:flex;gap:6px;justify-content:flex-end;margin-top:3px;}
.w-pill{font-size:10px;color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.05);padding:2px 7px;border-radius:10px;}
.w-city{font-size:10px;color:rgba(255,255,255,0.25);margin-top:3px;text-align:right;}

/* === DESKTOP: smartphone centrado === */
.app-wrapper{
  width:100%;
  max-width:430px;
  margin:0 auto;
  background:#060610;
  min-height:100vh;
}
body{background:#02020a;}

.footer-copy{
  text-align:center;
  padding:16px 12px 24px;
  font-size:11px;
  color:rgba(255,255,255,0.2);
  letter-spacing:0.05em;
}

/* ===== EQUIPAS HOJE ===== */
.teams-today{
  margin-top:12px;padding-top:12px;
  border-top:0.5px solid rgba(255,255,255,0.07);
}
.teams-today-title{
  font-size:10px;color:rgba(255,255,255,0.3);
  text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;
}
.teams-today-grid{display:flex;gap:8px;}
.tt-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 4px;border-radius:12px;
  border:0.5px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.02);
  transition:all .3s;
}
.tt-item.tt-active{
  border-color:rgba(74,171,106,0.45);
  background:rgba(74,171,106,0.08);
  box-shadow:0 0 12px rgba(74,171,106,0.12);
}
.tt-shift{font-size:10px;color:rgba(255,255,255,0.4);}
.tt-item.tt-active .tt-shift{color:#4aab6a;font-weight:600;}
.tt-team{font-size:17px;font-weight:700;}
.tt-team-m{color:#FFE600;}
.tt-team-t{color:#00BFFF;}
.tt-team-n{color:#00FFB4;}
.tt-hours{font-size:9px;color:rgba(255,255,255,0.25);}
.tt-item.tt-active .tt-hours{color:rgba(74,171,106,0.7);}
</style>
</head>

function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
let curTeam = safeGet('team') || 'A';

const SHIFT_CLS = {'5':'dc-m','13':'dc-t','21':'dc-n','F':'dc-f','X':'dc-x'};
const SHIFT_NUM_LBL = {'5':'05h','13':'13h','21':'21h','F':'Folga','X':'Ferias'};
const SHIFT_DESC = {'5':'Manha 05-13','13':'Tarde 13-21','21':'Noite 21-05','F':'Dia de folga','X':'Ferias + Feriado'};
const STAT_COLORS = {'5':'#FFE600','13':'#00BFFF','21':'#00FFB4'};

function getTeamCls(team) {
  const map = {A:'m',B:'t',C:'c',D:'n',E:'x'};
  return map[team]||'m';
}


function getQuinzenaDays(team, year) {
  const yearData = (SCHEDULES[year]||{})[team]||[];
  const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];
  const quinzena = new Set();
  
  for(let m=0; m<12; m++) {
    for(let d=1; d<=monthDays[m]; d++) {
      const row = (yearData[m]||[]).find(r=>r[0]===d);
      const shift = row ? row[2] : 'F';
      if(shift === 'F') {
        // Count consecutive F days
        let count = 0;
        let mm = m, dd = d;
        while(mm < 12) {
          const r2 = (yearData[mm]||[]).find(r=>r[0]===dd);
          if(!r2 || r2[2] !== 'F') break;
          count++;
          dd++;
          if(dd > monthDays[mm]) { dd=1; mm++; }
        }
        if(count >= 12) {
          // Mark all these days as quinzena
          let mm2 = m, dd2 = d;
          for(let i=0; i<count; i++) {
            quinzena.add(`${mm2}-${dd2}`);
            dd2++;
            if(dd2 > monthDays[mm2]) { dd2=1; mm2++; }
          }
        }
      }
    }
  }
  return quinzena;
}

const RAINBOW_CLS = ['dc-q1','dc-q2','dc-q3','dc-q4','dc-q5','dc-q6','dc-q7'];

async function fetchWeather() {
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.1500&longitude=-8.8608&current=temperature_2m,weathercode,windspeed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=Europe/Lisbon&forecast_days=1';
    const res = await fetch(url);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weathercode;
    const wind = Math.round(data.current.windspeed_10m);
    const tmax = Math.round(data.daily.temperature_2m_max[0]);
    const tmin = Math.round(data.daily.temperature_2m_min[0]);

    const icons = {
      0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
      45:'🌫️', 48:'🌫️',
      51:'🌦️', 53:'🌦️', 55:'🌧️',
      61:'🌧️', 63:'🌧️', 65:'🌧️',
      71:'❄️', 73:'❄️', 75:'❄️',
      80:'🌦️', 81:'🌧️', 82:'⛈️',
      95:'⛈️', 96:'⛈️', 99:'⛈️'
    };
    const descs = {
      0:'Céu limpo', 1:'Maioritariamente limpo', 2:'Parcialmente nublado', 3:'Nublado',
      45:'Nevoeiro', 48:'Nevoeiro',
      51:'Chuva fraca', 53:'Chuva moderada', 55:'Chuva forte',
      61:'Chuva fraca', 63:'Chuva moderada', 65:'Chuva forte',
      71:'Neve fraca', 73:'Neve moderada', 75:'Neve forte',
      80:'Aguaceiros', 81:'Aguaceiros', 82:'Aguaceiros fortes',
      95:'Trovoada', 96:'Trovoada', 99:'Trovoada'
    };
    const icon = icons[code] || icons[Math.floor(code/10)*10] || '🌡️';
    const desc = descs[code] || descs[Math.floor(code/10)*10] || '';

    const el = document.getElementById('weather-widget');
    if(el) el.innerHTML = `
      <div class="weather-row"><span class="w-icon">${icon}</span><span class="w-temp">${temp}°</span></div>

function renderCiclo() {
  const card = document.getElementById('ciclo-card');
  if(!card) return;

  const yearData = (SCHEDULES[curYear]||{})[curTeam]||[];
  const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];

  // Find current block (consecutive same-type days containing today)
  // First flatten all days
  const allDays = [];
  for(let m=0; m<12; m++) {
    for(let d=1; d<=monthDays[m]; d++) {
      const row = (yearData[m]||[]).find(r=>r[0]===d);
      const shift = row ? row[2] : 'F';
      allDays.push({m, d, shift, date: new Date(curYear, m, d)});
    }
  }

  // Find today index
  const todayIdx = allDays.findIndex(x => x.m===todayM && x.d===todayD);
  if(todayIdx < 0) { card.innerHTML = ''; return; }

  const todayShift = allDays[todayIdx].shift;

  // Group shift type: F and X both = 'folga'
  const grp = s => (s==='F'||s==='X') ? 'F' : s;
  const todayGrp = grp(todayShift);

  // Find block start
  let start = todayIdx;
  while(start > 0 && grp(allDays[start-1].shift) === todayGrp) start--;

  // Find block end
  let end = todayIdx;
  while(end < allDays.length-1 && grp(allDays[end+1].shift) === todayGrp) end++;

  const total = end - start + 1;
  const done = todayIdx - start; // days passed (not including today)
  const remain = end - todayIdx; // days remaining (not including today)

  // Find next block
  let nextShift = null;
  let nextCount = 0;
  if(end+1 < allDays.length) {
    const nGrp = grp(allDays[end+1].shift);
    let ni = end+1;
    while(ni < allDays.length && grp(allDays[ni].shift) === nGrp) { nextCount++; ni++; }
    nextShift = allDays[end+1].shift;
  }

  const SHIFT_INFO = {
    '5':  { emoji:'☀️', label:'Manhã 05h-13h',  color:'#FFE600', bg:'rgba(255,230,0,0.15)' },
    '13': { emoji:'🌊', label:'Tarde 13h-21h',  color:'#00BFFF', bg:'rgba(0,191,255,0.15)' },
    '21': { emoji:'🌙', label:'Noite 21h-05h',  color:'#00FFB4', bg:'rgba(0,255,180,0.15)' },
    'F':  { emoji:'🌿', label:'Folga',           color:'#A8D870', bg:'rgba(168,216,112,0.15)' },
  };
  const NEXT_COLORS = {'5':'#FFE600','13':'#00BFFF','21':'#00FFB4','F':'rgba(168,216,112,0.7)','X':'rgba(168,216,112,0.7)'};

  const info = SHIFT_INFO[todayGrp==='F'?'F':todayShift] || SHIFT_INFO['F'];
  const nextInfo = nextShift ? SHIFT_INFO[grp(nextShift)==='F'?'F':nextShift] : null;

  // Build dots
  let dotsHTML = '';
  for(let i=0; i<total; i++) {
    if(i < done) {
      dotsHTML += `<div class="ciclo-dot ciclo-dot-done"></div>`;
    } else if(i === done) {
      dotsHTML += `<div class="ciclo-dot ciclo-dot-today" style="background:${info.bg};border-color:${info.color};"><span style="color:${info.color}">${i+1}</span></div>`;
    } else {
      dotsHTML += `<div class="ciclo-dot ciclo-dot-future"><span>${i+1}</span></div>`;
    }
  }

  const nextHTML = nextInfo
    ? `<div class="ciclo-next-val" style="color:${nextInfo.color}">${nextInfo.emoji} ${nextInfo.label.split(' ')[0]} · ${nextCount} dias</div>`
    : `<div class="ciclo-next-val" style="color:rgba(255,255,255,0.3)">—</div>`;

  card.innerHTML = `
    <div class="ciclo-header">
      <div>
        <div class="ciclo-title" style="color:${info.color}">${info.emoji} ${info.label}</div>
        <div class="ciclo-sub">Bloco atual · ${total} dias</div>
      </div>
      <div class="ciclo-right">
        <div class="ciclo-num" style="color:${info.color}">${remain}</div>
        <div class="ciclo-sub2">RESTAM</div>
      </div>
    </div>
    <div class="ciclo-dots">${dotsHTML}</div>
    <div class="ciclo-next">
      <div class="ciclo-next-lbl">A seguir</div>
      ${nextHTML}
    </div>`;
}
function getGreeting() {
  const h = new Date().getHours();
  if(h >= 6 && h < 12) return 'Bom dia';
  if(h >= 12 && h < 20) return 'Boa tarde';
  return 'Boa noite';
}

function formatTime(d) {
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function renderClock() {
  const now = new Date();
  const el = document.getElementById('clock-time');
  if(el) el.textContent = formatTime(now);
}

function isInsideQuinzena(team, year) {
  const quinzenaDays = getQuinzenaDays(team, year);
  return quinzenaDays.has(`${todayM}-${todayD}`);
}

function getRemainingQuinzenaDays(team, year) {
  const quinzenaDays = getQuinzenaDays(team, year);
  const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];
  let count = 0;
  let m = todayM, d = todayD;
  while(m < 12) {
    if(!quinzenaDays.has(`${m}-${d}`)) break;
    count++;
    d++;
    if(d > monthDays[m]) { d=1; m++; }
  }
  return { days: count, returnM: m, returnD: d };
}

function renderQuinzena() {
  const card = document.getElementById('quinzena-card');
  if(!card) return;
  const yearData = (SCHEDULES[curYear]||{})[curTeam]||[];
  const monthDays = [31,28,31,30,31,30,31,31,30,31,30,31];
  
  // Find next big rest (14 consecutive F days)
  const today = new Date(todayY, todayM, todayD);
  let found = null;
  let dayCount = 0;
  
  for(let m=0; m<12; m++) {
    const days = monthDays[m];
    for(let d=1; d<=days; d++) {
      const date = new Date(curYear, m, d);
      const row = (yearData[m]||[]).find(r=>r[0]===d);
      const shift = row ? row[2] : 'F';
      if(date >= today && shift === 'F') {
        // Count consecutive F
        let count = 0;
        let mm = m, dd = d;
        while(mm < 12) {
          const r2 = (yearData[mm]||[]).find(r=>r[0]===dd);
          if(!r2 || r2[2] !== 'F') break;
          count++;
          dd++;
          if(dd > monthDays[mm]) { dd=1; mm++; }
        }
        if(count >= 12) {
          found = {date, count, daysUntil: Math.round((date - today) / 86400000)};
          break;
        }
      }
    }
    if(found) break;
  }
  
  const mns = typeof MONTH_NAMES !== 'undefined' ? MONTH_NAMES : MONTH_NAMES_PT;

  // Check if currently inside quinzena
  if(curYear === todayY && isInsideQuinzena(curTeam, curYear)) {
    const rem = getRemainingQuinzenaDays(curTeam, curYear);
    const returnDate = new Date(curYear, rem.returnM, rem.returnD);
    card.innerHTML = `<div class="rainbow-card" style="width:100%;">
      <div class="rainbow-text">
        <span class="c1">E</span><span class="c2">S</span><span class="c3">T</span><span class="c4">A</span><span class="c5">S</span>&nbsp;<span class="c6">D</span><span class="c1">E</span>&nbsp;<span class="c2">F</span><span class="c3">E</span><span class="c4">R</span><span class="c5">I</span><span class="c6">A</span><span class="c1">S</span>&nbsp;<span class="c2">🏖️</span>
      </div>
      <div class="rainbow-sub">Ainda tens ${rem.days} dias · Volta a ${returnDate.getDate()} ${mns[returnDate.getMonth()]}</div>
    </div>`;
    return;
  }

  if(found) {
    const daysLeft = found.daysUntil;
    card.innerHTML = `
      <div class="q-left">
        <div class="q-lbl">Proxima quinzena</div>
        <div class="q-val">${found.date.getDate()} ${mns[found.date.getMonth()]} · ${found.count} dias</div>
      </div>
      <div class="q-days">
        <div class="q-num">${daysLeft}</div>
        <div class="q-sub">${daysLeft===1?'AMANHA':'DIAS'}</div>
      </div>`;
  } else {
    card.innerHTML = '';
  }
}


// ===== EQUIPAS HOJE =====
function getTeamsToday(){
  // Que equipa faz M, T, N hoje (e amanhã para a Noite depois das 21h)
  const res = {};
  for(const tm of ['A','B','C','D','E']){
    const s = getShift(tm, todayY, todayM, todayD);
    if(s==='5') res.M = tm;
    else if(s==='13') res.T = tm;
    else if(s==='21') res.N = tm;
  }
  return res;
}

function getCurrentShiftKey(){
  // Que turno está a decorrer agora: M (05-13), T (13-21), N (21-05)
  const h = new Date().getHours();
  if(h >= 5 && h < 13) return 'M';
  if(h >= 13 && h < 21) return 'T';
  return 'N';
}

function teamsHTMLToday(){
  const tt = getTeamsToday();
  const cur = getCurrentShiftKey();
  const items = [
    {k:'M', lbl:'☀️ Manhã', team:tt.M||'—', cls:'m', hrs:'05-13'},
    {k:'T', lbl:'🌊 Tarde', team:tt.T||'—', cls:'t', hrs:'13-21'},
    {k:'N', lbl:'🌙 Noite', team:tt.N||'—', cls:'n', hrs:'21-05'},
  ];
  return `
    <div class="teams-today">
      <div class="teams-today-title">Equipas hoje</div>
      <div class="teams-today-grid">
        ${items.map(it => `
          <div class="tt-item${it.k===cur?' tt-active':''}">
            <span class="tt-shift">${it.lbl}</span>
            <span class="tt-team tt-team-${it.cls}">${it.team}</span>
            <span class="tt-hours">${it.hrs}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderStats() {
  const grid = document.getElementById('stats-grid');
  if(!grid) return;
  let m=0,t=0,n=0,f=0,x=0;
  const yearData = (SCHEDULES[curYear]||{})[curTeam]||[];
  yearData.forEach(month => month.forEach(row => {
    const s = row[2];
    if(s==='5') m++;
    else if(s==='13') t++;
    else if(s==='21') n++;
    else if(s==='X') x++;
    else f++;
  }));
  const stats = [
    {num:m,lbl:'Manha',color:'#378ADD'},
    {num:t,lbl:'Tarde',color:'#1D9E75'},
    {num:n,lbl:'Noite',color:'#7F77DD'},
    {num:m+t+n+x,lbl:'Trabalhados',color:'rgba(255,255,255,0.2)'},
  ];
  grid.innerHTML = stats.map(s=>`
    <div class="stat">
      <div class="stat-bar" style="background:${s.color}"></div>
      <div><div class="stat-num" style="color:${s.color}">${s.num}</div><div class="stat-lbl">${s.lbl}</div></div>
    </div>`).join('');
}

function renderFeriados() {
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  const items = [];
  const shiftColors = {'5':'#85B7EB','13':'#5DCAA5','21':'#AFA9EC','F':'rgba(255,255,255,0.2)','X':'#FFD166'};
  for(let d=1;d<=daysInMonth;d++){
    const fer = getFeriadoLocal(d, curMonth);
    if(fer){
      const s = getShift(curTeam, curYear, curMonth, d);
      const isX = s==='X';
      items.push(`<div class="fer-item">
        <span class="fer-day">${d}</span>
        <span class="fer-name">${fer}</span>
        <span class="fer-shift" style="color:${shiftColors[s]||''}">${isX?'Ferias':s==='F'?'Folga':SHIFT_NUM_LBL[s]}</span>
      </div>`);
    }
  }
  const itemsEl = document.getElementById('fer-items');
  if(itemsEl) itemsEl.innerHTML = items.length > 0 ? items.join('') : '<div style="color:rgba(255,255,255,0.35);font-size:12px;">Sem feriados este mes</div>';
}

function renderCalendar() {
  const mns = (typeof MONTH_NAMES !== 'undefined' ? MONTH_NAMES : MONTH_NAMES_PT);
  document.getElementById('month-title').textContent = mns[curMonth] + ' ' + curYear;
  const yearData = (SCHEDULES[curYear]||{})[curTeam]||[];
  const data = yearData[curMonth]||[];
  const firstDow = new Date(curYear, curMonth, 1).getDay();
  const quinzenaDays = getQuinzenaDays(curTeam, curYear);
  const tbody = document.getElementById('cal-body');
  tbody.innerHTML = '';
  let cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  const daysInMonth = new Date(curYear, curMonth+1, 0).getDate();
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7) cells.push(null);
  for(let r=0;r<cells.length/7;r++){
    const tr = document.createElement('tr');
    for(let c=0;c<7;c++){
      const td = document.createElement('td');
      const day = cells[r*7+c];
      if(day){
        const row = data.find(x=>x[0]===day);
        const shift = row ? row[2] : 'F';
        const isToday = curYear===todayY && curMonth===todayM && day===todayD;
        const hasFer = !!getFeriadoLocal(day, curMonth);
        const isX = shift==='X';
        const isQuinzena = shift==='F' && quinzenaDays.has(`${curMonth}-${day}`);
        const cls = SHIFT_CLS[shift]||'dc-f';
        const div = document.createElement('div');
        div.className = `day-cell ${cls}${isToday?' today-ring':''}`;
        const faixaHTML = isX
          ? '<div class="faixa faixa-x"><span>FERIAS</span></div>'
          : hasFer ? '<div class="faixa faixa-fer"><span>FERIADO</span></div>' : '';
        div.innerHTML = `${faixaHTML}<span class="day-num">${day}</span><span class="day-lbl">${shift==='F'?'Folga':SHIFT_NUM_LBL[shift]}</span>`;
        td.appendChild(div);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

function setTeam(t){
  curTeam = t;
  safeSet('team',t);
  document.querySelectorAll('.team-tab').forEach(b=>{
    b.className = 'team-tab' + (b.dataset.team===t?' active-'+t:'');
  });
  renderTodayCard();
  renderCiclo();
  renderCalendar();
  renderFeriados();
  renderMedico();
  renderStats();
  renderQuinzena();
}

document.getElementById('tabs').addEventListener('click', e=>{
  if(e.target.dataset.team) setTeam(e.target.dataset.team);
});

document.getElementById('prev-yr').onclick = ()=>{curYear--;document.getElementById('year-lbl').textContent=curYear;renderTodayCard();renderCalendar();renderFeriados();renderStats();};
document.getElementById('next-yr').onclick = ()=>{curYear++;document.getElementById('year-lbl').textContent=curYear;renderTodayCard();renderCalendar();renderFeriados();renderStats();};
document.getElementById('prev-mo').onclick = ()=>{if(curMonth===0){curMonth=11;curYear--;}else curMonth--;document.getElementById('year-lbl').textContent=curYear;renderCalendar();renderFeriados();};
document.getElementById('next-mo').onclick = ()=>{if(curMonth===11){curMonth=0;curYear++;}else curMonth++;document.getElementById('year-lbl').textContent=curYear;renderCalendar();renderFeriados();};

const MONTH_NAMES_PT = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];



function getFeriadoLocal(day, month) {
  return getFeriado(curYear, month, day);
}

document.getElementById('year-lbl').textContent = curYear;

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('install-bar').classList.add('show');
});
document.getElementById('install-btn').onclick = async()=>{
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('install-bar').classList.remove('show'); }
};

setTeam(curTeam);
setInterval(renderClock, 1000);
// Atualizar destaque do turno quando muda a hora de turno (05h/13h/21h)
let _lastShiftKey = getCurrentShiftKey();
setInterval(() => {
  const k = getCurrentShiftKey();
  if(k !== _lastShiftKey){
    _lastShiftKey = k;
    renderTodayCard();
  }
}, 30000); // verifica a cada 30s

renderQuinzena();
renderCiclo();
renderMedico();
fetchWeather();
setInterval(fetchWeather, 1800000);
</script>

<script>
if('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  }).then(() => {
    navigator.serviceWorker.register('sw.js?v=9').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', () => {
          if(newSW.state === 'activated') window.location.reload();
        });
      });
    });
  });
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data === 'reload') window.location.reload();
  });
}
</script>
