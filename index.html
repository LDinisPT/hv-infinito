<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Verallia Turnos 2026 • Fontela</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,sans-serif;margin:0}
  .header{padding:14px 16px;background:#1e2937;display:flex;justify-content:space-between;align-items:center}
  .tabs{display:flex;gap:6px;padding:8px 16px;background:#1e2937;overflow-x:auto}
  .tab{padding:10px 18px;border-radius:999px;background:#334155;color:#94a3b8;font-weight:600}
  .tab.active{background:#3b82f6;color:white}
  .today-card{margin:12px 16px;padding:20px;background:#1e2937;border-radius:20px}
  .shift-big{font-size:42px;font-weight:900;padding:8px 32px;border-radius:999px;background:#3b82f6;color:white;display:inline-block}
  .calendar{margin:0 16px 20px;background:#1e2937;border-radius:20px;padding:16px}
  table{width:100%;border-collapse:separate;border-spacing:5px}
  .day{background:#334155;border-radius:12px;padding:6px 4px;text-align:center;font-size:15px;font-weight:600;min-height:68px;position:relative}
  .day.m{background:#22d3ee;color:#0f172a}
  .day.t{background:#86efac;color:#0f172a}
  .day.n{background:#a855f7;color:white}
  .day.f{background:#64748b;color:#cbd5e1}
  .today-ring{box-shadow:0 0 0 3px #f97316}
</style>
</head>
<body>

<div class="header">
  <div><b>Verallia Turnos 2026</b><br><span style="font-size:13px;opacity:0.7">Fontela, Figueira da Foz</span></div>
</div>

<div class="tabs" id="tabs"></div>

<div class="today-card" id="today-card"></div>

<div class="calendar">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <button onclick="prev()" style="font-size:24px;background:none;border:none;color:white">‹</button>
    <b id="month-title" style="font-size:19px">Maio 2026</b>
    <button onclick="next()" style="font-size:24px;background:none;border:none;color:white">›</button>
  </div>
  <table id="cal"></table>
</div>

<div style="text-align:center;margin:10px 16px;font-size:13px">
  🔵 Manhã 🟢 Tarde 🟣 Noite 🟡 Feriado ⚪ Folga 🔴 Hoje
</div>

<script src="schedule-data.js"></script>
<script>
// Tabs
['A','B','C','D','E'].forEach(t=>{
  const b=document.createElement('button');
  b.className=`tab ${t==='A'?'active':''}`;
  b.textContent=`Equipa ${t}`;
  b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');curTeam=t;render()};
  document.getElementById('tabs').appendChild(b);
});

let curTeam='A';
function render(){
  document.getElementById('today-card').innerHTML=`
    <div style="display:flex;justify-content:space-between">
      <div>
        <div style="color:#94a3b8">HOJE • Equipa <b>${curTeam}</b></div>
        <div style="font-size:17px;font-weight:600">Sábado, 30 Maio</div>
        <div>Amanhã: 31 Maio — 05h</div>
      </div>
      <div style="text-align:right">
        <div class="shift-big">05h</div>
        <div style="margin-top:4px;font-size:14px">Manhã 05-13</div>
      </div>
    </div>
    <div style="margin-top:12px;background:#334155;border-radius:12px;padding:8px 12px;font-size:13px">05h — Manhã 05-13</div>
  `;

  // Calendário (igual ao da imagem)
  let html = `<tr><th>Dom</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sab</th></tr><tr>`;
  const shifts = ['n','n','n','n','f','t','t','t','t','f','f','f','f','f','f','f','f','t','t','t','t','f','f','f','t','t','t','t','f','m','m'];
  shifts.forEach((cls,i)=>{
    const d = i+1;
    html += `<td><div class="day ${cls} ${d===30?'today-ring':''}">${d}<br><small>${cls==='m'?'05h':cls==='t'?'13h':cls==='n'?'21h':'—'}</small></div></td>`;
    if((i+1)%7===0) html += '</tr><tr>';
  });
  document.getElementById('cal').innerHTML = html;
}
render();
</script>
</body>
</html>
