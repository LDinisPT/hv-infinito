<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Verallia Turnos 2026 • Fontela</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,sans-serif;margin:0}
.header{padding:12px 16px;background:#1e2937;display:flex;justify-content:space-between}
.tabs{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#1e2937}
.tab{padding:10px 20px;border-radius:999px;background:#334155;color:#cbd5e1;font-weight:700}
.tab.active{background:#60a5fa;color:#0f172a}
.today-card{margin:12px 16px;padding:20px;background:#1e2937;border-radius:24px}
.shift-big{font-size:52px;font-weight:900;background:#60a5fa;color:#0f172a;padding:8px 32px;border-radius:999px;display:inline-block}
.calendar{margin:0 16px 20px;background:#1e2937;border-radius:22px;padding:16px}
table{width:100%;border-collapse:separate;border-spacing:5px}
.day{background:#475569;border-radius:14px;padding:8px 4px;text-align:center;font-weight:600;min-height:62px}
.day.m{background:#67e8f9;color:#0f172a}
.day.t{background:#86efac;color:#0f172a}
.day.n{background:#c084fc;color:white}
.day.x{background:#fcd34d;color:#1e2937}
.day.f{background:#64748b;color:#e2e8f0}
</style>
</head>
<body>

<div class="header">
  <div style="font-weight:700;font-size:20px">Verallia Turnos 2026</div>
  <div>Fontela • Figueira da Foz</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="setTeam('A')">A</button>
  <button class="tab" onclick="setTeam('B')">B</button>
  <button class="tab" onclick="setTeam('C')">C</button>
  <button class="tab" onclick="setTeam('D')">D</button>
  <button class="tab" onclick="setTeam('E')">E</button>
</div>

<div class="today-card" id="today">
  HOJE • Equipa <b>A</b><br>
  Sábado, 30 Maio — <span class="shift-big">05h</span><br>
  Amanhã: 31 Maio — 05h
</div>

<div class="calendar">
  <div style="text-align:center;font-size:19px;font-weight:700" id="mes">Maio 2026</div>
  <table id="cal"></table>
</div>

<script src="schedule-data.js"></script>
<script>
let curTeam = 'A';
function setTeam(t) {
  curTeam = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.textContent === t));
  alert('✅ Equipa ' + t + ' carregada!\n\nCalendário completo de 2026 visível para todas as equipas.');
  renderCalendar();
}
function renderCalendar() {
  let html = '<tr><th>D</th><th>S</th><th>T</th><th>Q</th><th>Q</th><th>S</th><th>S</th></tr><tr>';
  for(let d=1; d<=31; d++) {
    let cls = 'day';
    if(d%7===1) cls += ' n'; else if(d%7===2) cls += ' m'; else if(d%7===3) cls += ' t';
    html += `<td><div class="${cls}">${d}<br><small>05h</small></div></td>`;
    if(d%7===0) html += '</tr><tr>';
  }
  document.getElementById('cal').innerHTML = html + '</tr>';
}
renderCalendar();
</script>
</body>
</html>
