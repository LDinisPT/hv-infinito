<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verallia Turnos">
<link rel="manifest" href="manifest.json">
<title>Verallia Turnos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;
  --m-col:#4a90d9;--m-bg:#0d2340;--m-bd:#4a90d9;
  --t-col:#4aab5a;--t-bg:#0d2414;--t-bd:#4aab5a;
  --n-col:#8a60d9;--n-bg:#1a0d40;--n-bd:#8a60d9;
  --x-col:#d9a030;--x-bg:#3d2800;--x-bd:#d9a030;
  --f-col:#606080;--f-bg:#1e1e2e;--f-bd:#333350;
  --text:#e8e8f0;--text2:#a0a0c0;--text3:#606080;
  --red:#ff5555;--rad:10px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overscroll-behavior:none;}

.topbar{background:var(--bg2);padding:12px 16px 8px;position:sticky;top:0;z-index:100;border-bottom:1px solid #ffffff10;}
.app-title{font-size:16px;font-weight:600;}
.app-sub{font-size:11px;color:var(--text2);margin-bottom:8px;}

.team-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;}
.team-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid #ffffff20;background:transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;}
.team-tab.active-A{border-color:var(--m-bd);background:var(--m-bg);color:var(--m-col);}
.team-tab.active-B{border-color:var(--t-bd);background:var(--t-bg);color:var(--t-col);}
.team-tab.active-C{border-color:#d95a4a;background:#2a0d0a;color:#d95a4a;}
.team-tab.active-D{border-color:var(--n-bd);background:var(--n-bg);color:var(--n-col);}
.team-tab.active-E{border-color:var(--x-bd);background:var(--x-bg);color:var(--x-col);}

.today-card{margin:10px 12px 6px;padding:14px;border-radius:var(--rad);background:var(--bg2);border:1px solid #ffffff10;}
.today-lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.today-row{display:flex;align-items:center;justify-content:space-between;}
.today-date{font-size:13px;color:var(--text2);}
.today-fer{font-size:11px;margin-top:2px;}
.shift-badge{padding:8px 18px;border-radius:20px;font-size:15px;font-weight:700;border:2px solid;}
.shift-desc{font-size:11px;margin-top:4px;text-align:center;}
.tom-row{margin-top:10px;padding-top:8px;border-top:1px solid #ffffff08;display:flex;align-items:center;justify-content:space-between;}
.tom-lbl{font-size:11px;color:var(--text3);}
.tom-badge{padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;border:1.5px solid;}

.year-nav{display:flex;align-items:center;gap:6px;padding:6px 12px 0;}
.year-lbl{font-size:13px;font-weight:600;color:var(--text2);min-width:40px;text-align:center;}
.nav-btn{background:transparent;border:none;color:var(--text2);font-size:20px;padding:4px 8px;cursor:pointer;border-radius:6px;line-height:1;}
.nav-btn:active{background:#ffffff10;}

.month-nav{display:flex;align-items:center;padding:2px 12px 6px;}
.month-title{flex:1;text-align:center;font-size:15px;font-weight:600;}

.legend{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 8px;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;}
.leg-box{width:28px;height:14px;border-radius:3px;border:1.5px solid;}

.cal-wrap{padding:0 6px 80px;}
.cal{width:100%;border-collapse:separate;border-spacing:3px;}
.cal th{font-size:10px;color:var(--text3);padding:3px 0;text-align:center;font-weight:400;}
.cal td{padding:0;}
.dc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;border-radius:7px;border:1.5px solid transparent;position:relative;}
.dn{font-size:12px;font-weight:500;}
.dl{font-size:9px;margin-top:1px;font-weight:700;letter-spacing:.02em;}
.dc-m{background:var(--m-bg);border-color:var(--m-bd);}
.dc-m .dn,.dc-m .dl{color:var(--m-col);}
.dc-t{background:var(--t-bg);border-color:var(--t-bd);}
.dc-t .dn,.dc-t .dl{color:var(--t-col);}
.dc-n{background:var(--n-bg);border-color:var(--n-bd);}
.dc-n .dn,.dc-n .dl{color:var(--n-col);}
.dc-x{background:var(--x-bg);border-color:var(--x-bd);}
.dc-x .dn,.dc-x .dl{color:var(--x-col);}
.dc-f{background:var(--f-bg);}
.dc-f .dn{color:var(--text3);}
.dc-c{background:#2a0d0a;border-color:#d95a4a;}
.dc-c .dn,.dc-c .dl{color:#d95a4a;}
.fer-dot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--red);}
.today-ring{outline:2px solid var(--red);outline-offset:1px;}

.install-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid #ffffff15;padding:10px 16px;display:none;align-items:center;gap:10px;}
.install-bar.show{display:flex;}
.install-txt{flex:1;font-size:12px;color:var(--text2);}
.install-btn{padding:7px 16px;border-radius:20px;background:var(--m-bg);border:1.5px solid var(--m-bd);color:var(--m-col);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>
<div class="topbar">
  <div class="app-title">Verallia Turnos</div>
  <div class="app-sub">Fontela · Figueira da Foz</div>
  <div class="team-tabs" id="tabs">
    <button class="team-tab" data-team="A">Equipa A</button>
    <button class="team-tab" data-team="B">Equipa B</button>
    <button class="team-tab" data-team="C">Equipa C</button>
    <button class="team-tab" data-team="D">Equipa D</button>
    <button class="team-tab" data-team="E">Equipa E</button>
  </div>
</div>

<div class="today-card" id="today-card"></div>

<div class="legend">
  <div class="leg"><div class="leg-box" style="background:var(--m-bg);border-color:var(--m-bd)"></div><span style="color:var(--m-col)">Manha</span></div>
  <div class="leg"><div class="leg-box" style="background:var(--t-bg);border-color:var(--t-bd)"></div><span style="color:var(--t-col)">Tarde</span></div>
  <div class="leg"><div class="leg-box" style="background:var(--n-bg);border-color:var(--n-bd)"></div><span style="color:var(--n-col)">Noite</span></div>
  <div class="leg"><div class="leg-box" style="background:var(--x-bg);border-color:var(--x-bd)"></div><span style="color:var(--x-col)">Feriado</span></div>
  <div class="leg"><div class="leg-box" style="background:var(--f-bg);border-color:var(--f-bd)"></div><span style="color:var(--f-col)">Folga</span></div>
  <div class="leg"><div class="leg-box" style="border:2px solid var(--red);background:transparent;border-radius:50%"></div><span style="color:var(--red)">Hoje</span></div>
</div>

<div class="year-nav">
  <button class="nav-btn" id="prev-yr">&#8249;</button>
  <div class="year-lbl" id="year-lbl"></div>
  <button class="nav-btn" id="next-yr">&#8250;</button>
</div>
<div class="month-nav">
  <button class="nav-btn" id="prev-mo">&#8249;</button>
  <div class="month-title" id="month-title"></div>
  <button class="nav-btn" id="next-mo">&#8250;</button>
</div>

<div class="cal-wrap">
  <table class="cal">
    <thead><tr><th>Dom</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sab</th></tr></thead>
    <tbody id="cal-body"></tbody>
  </table>
</div>

<div class="install-bar" id="install-bar">
  <div class="install-txt">Instala no ecra inicial para acesso rapido!</div>
  <button class="install-btn" id="install-btn">Instalar</button>
</div>

<script src="schedule-data.js"></script>
<script>
const TEAM_COLORS = {A:'m',B:'t',C:'c',D:'n',E:'x'};
const SHIFT_INFO = {
  '5':  {cls:'dc-m',lbl:'05h',desc:'Manha 05-13'},
  '13': {cls:'dc-t',lbl:'13h',desc:'Tarde 13-21'},
  '21': {cls:'dc-n',lbl:'21h',desc:'Noite 21-05'},
  'F':  {cls:'dc-f',lbl:'—',  desc:'Folga'},
};
function shiftBadgeClass(s,team){
  const tc=TEAM_COLORS[team]||'m';
  const map={'5':'shift-m','13':'shift-t','21':'shift-n','F':'shift-f'};
  const base={
    'm':'background:var(--m-bg);border-color:var(--m-bd);color:var(--m-col)',
    't':'background:var(--t-bg);border-color:var(--t-bd);color:var(--t-col)',
    'c':'background:#2a0d0a;border-color:#d95a4a;color:#d95a4a',
    'n':'background:var(--n-bg);border-color:var(--n-bd);color:var(--n-col)',
    'x':'background:var(--x-bg);border-color:var(--x-bd);color:var(--x-col)',
    'f':'background:var(--f-bg);border-color:var(--f-bd);color:var(--f-col)',
  };
  if(s==='F') return base['f'];
  return base[tc];
}

const today = new Date();
const todayD=today.getDate(),todayM=today.getMonth(),todayY=today.getFullYear();
let curTeam = localStorage.getItem('team')||'A';
let curMonth = todayM;
let curYear = todayY;

function shiftCellClass(s,team){
  if(s==='5') return team==='C'?'dc-c':'dc-m';
  if(s==='13') return team==='B'?'dc-t':team==='C'?'dc-c':'dc-t';
  if(s==='21') return team==='D'?'dc-n':team==='C'?'dc-c':'dc-n';
  return 'dc-f';
}
function getShiftCellClass(s,team){
  const map={'5':'dc-m','13':'dc-t','21':'dc-n','F':'dc-f'};
  if(team==='C') return s==='F'?'dc-f':'dc-c';
  if(team==='E') return s==='F'?'dc-f':'dc-x';
  return map[s]||'dc-f';
}

function renderToday(){
  const t=new Date(todayY,todayM,todayD);
  const tom=new Date(todayY,todayM,todayD+1);
  const s=getShift(curTeam,t);
  const st=getShift(curTeam,tom);
  const fer=getFeriado(t);
  const ferTom=getFeriado(tom);
  const wdays=['Domingo','Segunda','Terca','Quarta','Quinta','Sexta','Sabado'];
  const si=SHIFT_INFO[s]||SHIFT_INFO['F'];
  const sit=SHIFT_INFO[st]||SHIFT_INFO['F'];
  const badge=shiftBadgeClass(s,curTeam);
  const badget=shiftBadgeClass(st,curTeam);
  document.getElementById('today-card').innerHTML=`
    <div class="today-lbl">Hoje · Equipa ${curTeam}</div>
    <div class="today-row">
      <div>
        <div class="today-date">${wdays[t.getDay()]}, ${todayD} ${MONTH_NAMES[todayM]} ${todayY}</div>
        ${fer?`<div class="today-fer" style="color:var(--x-col)">${fer}</div>`:''}
      </div>
      <div style="text-align:center">
        <div class="shift-badge" style="${badge}">${s==='F'?'FOLGA':si.lbl}</div>
        <div class="shift-desc" style="color:var(--text2)">${si.desc}</div>
      </div>
    </div>
    <div class="tom-row">
      <div class="tom-lbl">Amanha: ${tom.getDate()} ${MONTH_NAMES[tom.getMonth()]}${ferTom?' · '+ferTom:''}</div>
      <div class="tom-badge" style="${badget}">${st==='F'?'FOLGA':sit.lbl} — ${sit.desc}</div>
    </div>`;
}

function renderCalendar(){
  document.getElementById('year-lbl').textContent=curYear;
  document.getElementById('month-title').textContent=MONTH_NAMES[curMonth];
  const daysInMonth=getDaysInMonth(curYear,curMonth);
  const firstDow=new Date(curYear,curMonth,1).getDay();
  const tbody=document.getElementById('cal-body');
  tbody.innerHTML='';
  let cells=Array(firstDow).fill(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7) cells.push(null);
  for(let r=0;r<cells.length/7;r++){
    const tr=document.createElement('tr');
    for(let c=0;c<7;c++){
      const td=document.createElement('td');
      const day=cells[r*7+c];
      if(day){
        const date=new Date(curYear,curMonth,day);
        const s=getShift(curTeam,date);
        const fer=getFeriado(date);
        const si=SHIFT_INFO[s]||SHIFT_INFO['F'];
        const cellClass=getShiftCellClass(s,curTeam);
        const isToday=curYear===todayY&&curMonth===todayM&&day===todayD;
        const div=document.createElement('div');
        div.className=`dc ${cellClass}${isToday?' today-ring':''}`;
        div.innerHTML=`<span class="dn">${day}</span><span class="dl">${s==='F'?'—':si.lbl}</span>${fer?'<div class="fer-dot"></div>':''}`;
        td.appendChild(div);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

function setTeam(t){
  curTeam=t;
  localStorage.setItem('team',t);
  document.querySelectorAll('.team-tab').forEach(b=>{
    b.className='team-tab'+(b.dataset.team===t?' active-'+t:'');
  });
  renderToday();
  renderCalendar();
}

document.getElementById('tabs').addEventListener('click',e=>{
  if(e.target.dataset.team) setTeam(e.target.dataset.team);
});
document.getElementById('prev-yr').onclick=()=>{curYear--;renderCalendar();};
document.getElementById('next-yr').onclick=()=>{curYear++;renderCalendar();};
document.getElementById('prev-mo').onclick=()=>{
  if(curMonth===0){curMonth=11;curYear--;}else curMonth--;
  renderCalendar();
};
document.getElementById('next-mo').onclick=()=>{
  if(curMonth===11){curMonth=0;curYear++;}else curMonth++;
  renderCalendar();
};

let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install-bar').classList.add('show');
});
document.getElementById('install-btn').onclick=async()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
    document.getElementById('install-bar').classList.remove('show');
  }
};

setTeam(curTeam);
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
